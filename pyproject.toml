# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-detector"
version = "0.1.0"
description = "Cellpose-SAM + Spotiflow pipeline for segmenting cell-like structures and quantifying spot density in microscopy images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bioio>=3.4.0",
    "bioio-czi>=2.8.0",
    "bioio-lif>=1.5.0",
    "bioio-nd2>=2.3.0",
    "bioio-ome-tiff>=1.4.0",
    "bioio-tifffile>=1.3.0",
    "cellpose>=4.2.1.1",
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.11.0",
    "matplotlib-scalebar>=0.9.0",
    "napari[all]>=0.7.1",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "spotiflow>=0.6.5",
    "tqdm>=4.68.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]

[project.scripts]
spot-detector = "spot_detector.cli:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
]
