name: bioio_cellpose_spotiflow
channels:
  - conda-forge
  - bioconda

dependencies:
  # ---- Core Python ----
  - python=3.11
  - numpy<2
  - pandas
  - openpyxl
  - pyyaml
  - tqdm

  # ---- Dask ----
  - dask>=2024.4.1
  - dask-image

  # ---- Deep Learning ----
  - cellpose
  - spotiflow
  - segment-anything

  # ---- Viz + UI ----
  - matplotlib
  - matplotlib-scalebar
  - seaborn
#  - vispy
#  - pyqt6
#  - napari

  # ---- Jupyter / Notebook Tools ----
  - jupyterlab
  - ipykernel
  - ipywidgets

  # ---- Pip section ----
  - pip
  - pip:
      # ---- Napari ----
      - napari[all]

      # ---- PyTorch ----
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
      - torchaudio

      # ---- BioIO readers ----
      - bioio
      - bioio-czi
      - bioio-lif
      - bioio-nd2
      - bioio-ome-tiff
      - bioio-tifffile