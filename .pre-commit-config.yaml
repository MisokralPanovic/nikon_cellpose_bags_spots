repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # VS Code rewrites these per machine/interpreter (e.g. "3.12.x", "3.12.-1") -> noisy diffs.
        # Whole kernelspec, not just display_name: nbformat requires name + display_name together.
        args:
          - --extra-keys
          - metadata.kernelspec metadata.language_info.version
